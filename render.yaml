services:
  - type: web
    name: referencia-biblica
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: CANTARI_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
